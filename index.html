<!-- Google IMA renders VAST pre-roll ads over the native HTML5 video. -->
<script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
<script>
(() => {
  // Short MDN sample clip (flower time-lapse). Replace with your own video later.
  const CONTENT_VIDEO_URL = "https://mdn.github.io/shared-assets/videos/flower.mp4";

  // Deploy worker.js and replace this with its workers.dev URL.
  const VAST_PROXY_URL = "https://vast.yomeno.xyz/vast?spot_id=1503443";
  const DEBUG_VAST = new URLSearchParams(window.location.search).get("debug") === "vast";

  const frame = document.getElementById("tc-video-frame");
  const video = document.getElementById("tc-video");
  const adContainer = document.getElementById("tc-ad-container");
  const playButton = document.getElementById("tc-play");
  const status = document.getElementById("tc-video-status");

  let adDisplayContainer;
  let adsLoader;
  let adsManager;
  let adRequestFailed = false;
  let adStarted = false;

  if (CONTENT_VIDEO_URL) video.src = CONTENT_VIDEO_URL;

  function startContentWithoutAd(message) {
    frame.classList.remove("is-ad-active");
    video.controls = true;
    playButton.disabled = true;
    playButton.hidden = true;
    if (!CONTENT_VIDEO_URL) {
      status.textContent = `${message} CONTENT_VIDEO_URL has to be set.`;
      return;
    }
    status.textContent = message;
    video.play().catch(() => {
      status.textContent = "Press again play to show.";
      video.controls = true;
    });
  }

  function handleAdError(event) {
    const error = event && typeof event.getError === "function"
      ? event.getError()
      : event;
    const errorCode = error && typeof error.getErrorCode === "function"
      ? error.getErrorCode()
      : null;
    const vastErrorCode = error && typeof error.getVastErrorCode === "function"
      ? error.getVastErrorCode()
      : null;
    const errorType = error && typeof error.getType === "function"
      ? error.getType()
      : "unknown";
    const errorMessage = error && typeof error.getMessage === "function"
      ? error.getMessage()
      : String(error || "Unknown IMA error");
    const innerError = error && typeof error.getInnerError === "function"
      ? error.getInnerError()
      : null;
    console.error("VAST/IMA error details:", {
      errorCode,
      vastErrorCode,
      errorType,
      errorMessage,
      innerError,
    });
    adRequestFailed = true;
    if (adsManager) {
      try { adsManager.destroy(); } catch (_) {}
      adsManager = null;
    }
    frame.classList.remove("is-ad-active");
    if (adStarted) {
      startContentWithoutAd("Ad couldn't be shown. Video shows without ad.");
    } else {
      playButton.disabled = false;
      playButton.textContent = "Start Video without ad";
      const statusMessage = errorCode === null
        ? "Ad couldn't load."
        : `Ad couldn't load (IMA ${errorCode}${vastErrorCode === null ? "" : ` / VAST ${vastErrorCode}`}).`;
      const diagnosticDetails = [
        errorType,
        errorMessage,
        innerError && (innerError.message || String(innerError)),
      ].filter(Boolean).join(" | ").replace(/\s+/g, " ").slice(0, 300);
      status.textContent = DEBUG_VAST && diagnosticDetails
        ? `${statusMessage} — ${diagnosticDetails}`
        : statusMessage;
    }
  }

  function onAdsManagerLoaded(event) {
    try {
      adsManager = event.getAdsManager(video);
      adsManager.addEventListener(
        google.ima.AdErrorEvent.Type.AD_ERROR,
        handleAdError
      );
      adsManager.addEventListener(
        google.ima.AdEvent.Type.CONTENT_PAUSE_REQUESTED,
        () => { video.pause(); }
      );
      adsManager.addEventListener(
        google.ima.AdEvent.Type.CONTENT_RESUME_REQUESTED,
        () => {
          frame.classList.remove("is-ad-active");
          video.controls = true;
          if (!video.ended) video.play().catch(() => {});
        }
      );
      adsManager.addEventListener(
        google.ima.AdEvent.Type.LOADED,
        event => {
          const ad = event.getAd();
          if (ad && !ad.isLinear()) video.play().catch(() => {});
        }
      );
      adsManager.addEventListener(
        google.ima.AdEvent.Type.ALL_ADS_COMPLETED,
        () => {
          frame.classList.remove("is-ad-active");
          video.controls = true;
        }
      );
      playButton.disabled = false;
      status.textContent = CONTENT_VIDEO_URL
        ? "Ready. Video starts for the Pre-Roll"
        : "VAST ready. CONTENT_VIDEO_URL for the Video adding.";
    } catch (error) {
      handleAdError(error);
    }
  }

  function initializePlayer() {
    if (!window.google || !google.ima) {
      status.textContent = "The IMA-SDK couldn't load.";
      playButton.disabled = false;
      playButton.textContent = "Video starting without ad.";
      adRequestFailed = true;
      return;
    }

    if (!VAST_PROXY_URL || VAST_PROXY_URL.includes("YOUR-WORKER")) {
      status.textContent = "Cloudflare-Worker ready and add VAST_PROXY_URL";
      playButton.disabled = false;
      playButton.textContent = "Start video without ad";
      adRequestFailed = true;
      return;
    }

    adDisplayContainer = new google.ima.AdDisplayContainer(adContainer, video);
    adsLoader = new google.ima.AdsLoader(adDisplayContainer);
    adsLoader.addEventListener(
      google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,
      onAdsManagerLoaded
    );
    adsLoader.addEventListener(
      google.ima.AdErrorEvent.Type.AD_ERROR,
      handleAdError
    );
    video.addEventListener("ended", () => adsLoader.contentComplete());

    const request = new google.ima.AdsRequest();
    request.adTagUrl = VAST_PROXY_URL;
    request.linearAdSlotWidth = frame.clientWidth || 640;
    request.linearAdSlotHeight = frame.clientHeight || 360;
    request.nonLinearAdSlotWidth = frame.clientWidth || 640;
    request.nonLinearAdSlotHeight = Math.max(80, Math.round(frame.clientHeight * 0.25));
    request.setAdWillAutoPlay(false);
    request.setAdWillPlayMuted(false);
    adsLoader.requestAds(request);
  }

  playButton.addEventListener("click", () => {
    if (adRequestFailed || !adsManager) {
      startContentWithoutAd("Video starts without ad.");
      return;
    }
    if (adStarted) return;

    adStarted = true;
    playButton.disabled = true;
    playButton.hidden = true;
    status.textContent = "Ad is shown …";
    video.controls = false;
    frame.classList.add("is-ad-active");

    try {
      // IMA requires this initialization to happen in the user's play gesture.
      adDisplayContainer.initialize();
      adsManager.init(frame.clientWidth, frame.clientHeight, google.ima.ViewMode.NORMAL);
      adsManager.start();
    } catch (error) {
      handleAdError(error);
    }
  });

  window.addEventListener("resize", () => {
    if (!adsManager || !frame.classList.contains("is-ad-active")) return;
    adsManager.resize(frame.clientWidth, frame.clientHeight, google.ima.ViewMode.NORMAL);
  });

  initializePlayer();
})();
</script>
